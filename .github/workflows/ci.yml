name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Validation des exercices et tests
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Installer les dépendances
        run: npm ci

      - name: Valider la structure des exercices
        run: node scripts/valider-exos.js

      - name: Lancer les tests du moteur et panneau Git
        run: |
          node src/depot/moteur.test.mjs
          node src/depot/panneau.test.mjs

      - name: Lancer les tests du tirage et simulateur PTP
        run: node --test prototypes/ptp/cas-de-test.test.mjs prototypes/ptp/ptp-logique.test.mjs prototypes/ptp/simuler.test.mjs
