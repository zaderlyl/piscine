<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 450" width="860" height="450" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title id="t">VS Code : initialiser le dépôt</title>
<desc id="d">La fenêtre de VS Code sur un dossier vide. Dans le panneau Contrôle de code source, le bouton Initialiser le dépôt exécute git init.</desc>
<rect width="860" height="450" rx="14" fill="#ffffff"/>
<rect x="30" y="24" width="800" height="300" rx="10" fill="#1e1e1e"/>
<path d="M30,34 a10,10 0 0 1 10,-10 h780 a10,10 0 0 1 10,10 v22 h-800 z" fill="#323233"/>
<circle cx="52" cy="40" r="6" fill="#ff5f57"/>
<circle cx="72" cy="40" r="6" fill="#febc2e"/>
<circle cx="92" cy="40" r="6" fill="#28c840"/>
<text x="430.0" y="45" text-anchor="middle" font-size="13" fill="#cccccc">mon-projet — Visual Studio Code</text>
<rect x="30" y="56" width="48" height="246" fill="#333333"/>
<g fill="none" stroke="#858585" stroke-width="2"><path d="M45,72 h10 l6,6 v14 h-16 z"/><path d="M51,68 h10 l6,6 v14"/></g>
<rect x="30" y="110" width="3" height="48" fill="#ffffff"/>
<g fill="none" stroke="#ffffff" stroke-width="2"><circle cx="48" cy="125" r="3.5"/><circle cx="48" cy="143" r="3.5"/><circle cx="62" cy="131" r="3.5"/><path d="M48,128.5 v11"/><path d="M62,134.5 c0,6 -14,2 -14,8"/></g>
<rect x="78" y="56" width="262" height="246" fill="#252526"/>
<text x="96" y="82" font-size="11" fill="#bbbbbb" letter-spacing="0.6">CONTRÔLE DE CODE SOURCE</text>
<text x="96" y="122" font-size="13" fill="#cccccc">Le dossier ouvert n'est pas</text>
<text x="96" y="142" font-size="13" fill="#cccccc">un dépôt Git.</text>
<rect x="96" y="162" width="226" height="32" rx="3" fill="#0e639c"/>
<text x="209" y="183" text-anchor="middle" font-size="14" fill="#ffffff">Initialiser le dépôt</text>
<text x="585.0" y="206" text-anchor="middle" font-size="22" fill="#5a5a5a">Aucun fichier ouvert</text>
<path d="M30,302 h800 v12 a10,10 0 0 1 -10,10 h-780 a10,10 0 0 1 -10,-10 z" fill="#007acc"/>
<rect x="34" y="112" width="40" height="44" rx="6" fill="none" stroke="#ef5b5b" stroke-width="3"/>
<circle cx="54" cy="180" r="15" fill="#ef5b5b" stroke="#ffffff" stroke-width="3"/>
<text x="54" y="186" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">1</text>
<rect x="92" y="158" width="234" height="40" rx="6" fill="none" stroke="#ef5b5b" stroke-width="3"/>
<circle cx="344" cy="178" r="15" fill="#ef5b5b" stroke="#ffffff" stroke-width="3"/>
<text x="344" y="184" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">2</text>
<rect x="30" y="342" width="800" height="86" rx="14" fill="#f4f5f8"/>
<rect x="30" y="342" width="8" height="86" rx="4" fill="#ef5b5b"/>
<circle cx="64" cy="368" r="12" fill="#ef5b5b"/><text x="64" y="374" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
<text x="86" y="373" font-size="15" fill="#1f2430">Ouvre le panneau <tspan font-weight="700">Contrôle de code source</tspan> (l'icône avec les trois points reliés).</text>
<circle cx="64" cy="402" r="12" fill="#ef5b5b"/><text x="64" y="408" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
<text x="86" y="407" font-size="15" fill="#1f2430">Clique sur <tspan font-weight="700">Initialiser le dépôt</tspan> : VS Code lance <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700">git init</tspan> à ta place.</text>
</svg>
