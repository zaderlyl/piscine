<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 807" width="860" height="807" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title id="t">Le trajet d'une fonctionnalité avec une pull request</title>
<desc id="d">De la création d'une branche sur ton ordinateur jusqu'au merge sur GitHub, puis la mise à jour de main chez toi, en 8 étapes.</desc>
<rect width="860" height="807" rx="14" fill="#ffffff"/>
<rect x="450" y="14" width="390" height="779" rx="10" fill="#fbe3c8"/>
<text x="215" y="56" text-anchor="middle" font-size="28" font-weight="700" fill="#1f2430">Ton ordinateur</text>
<text x="645" y="56" text-anchor="middle" font-size="28" font-weight="700" fill="#1f2430">GitHub</text>
<rect x="40" y="99" width="350" height="62" rx="16" fill="#4a5ea6"/>
<circle cx="70" cy="130" r="15" fill="#ffffff"/>
<text x="70" y="136" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2430">1</text>
<text x="98" y="126" font-size="18" font-weight="700" fill="#ffffff">Créer une branche</text>
<text x="98" y="148" font-size="14" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">git switch -c feature/menu</text>
<rect x="40" y="187" width="350" height="62" rx="16" fill="#4a5ea6"/>
<circle cx="70" cy="218" r="15" fill="#ffffff"/>
<text x="70" y="224" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2430">2</text>
<text x="98" y="214" font-size="18" font-weight="700" fill="#ffffff">Travailler et enregistrer</text>
<text x="98" y="236" font-size="14" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">git add  puis  git commit</text>
<path d="M215,286 L611,286 L611,278 L645,306 L611,334 L611,326 L215,326 Z" fill="#ef5b5b"/>
<circle cx="245" cy="306" r="15" fill="#ffffff"/>
<text x="245" y="312" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2430">3</text>
<text x="430.0" y="311" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">git push</text>
<text x="430.0" y="346" text-anchor="middle" font-size="13" fill="#3b4150">envoie ta branche sur GitHub</text>
<rect x="470" y="363" width="350" height="62" rx="16" fill="#ee7b22"/>
<circle cx="500" cy="394" r="15" fill="#ffffff"/>
<text x="500" y="400" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2430">4</text>
<text x="528" y="390" font-size="18" font-weight="700" fill="#ffffff">Ouvrir une pull request</text>
<text x="528" y="412" font-size="14" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">feature/menu  vers  main</text>
<rect x="470" y="451" width="350" height="62" rx="16" fill="#ee7b22"/>
<circle cx="500" cy="482" r="15" fill="#ffffff"/>
<text x="500" y="488" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2430">5</text>
<text x="528" y="478" font-size="18" font-weight="700" fill="#ffffff">Relecture</text>
<text x="528" y="500" font-size="14" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">un collègue lit et valide</text>
<rect x="470" y="539" width="350" height="62" rx="16" fill="#ee7b22"/>
<circle cx="500" cy="570" r="15" fill="#ffffff"/>
<text x="500" y="576" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2430">6</text>
<text x="528" y="566" font-size="18" font-weight="700" fill="#ffffff">Merge</text>
<text x="528" y="588" font-size="14" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">main reçoit ta branche</text>
<path d="M645,638 L249,638 L249,630 L215,658 L249,686 L249,678 L645,678 Z" fill="#ef5b5b"/>
<circle cx="615" cy="658" r="15" fill="#ffffff"/>
<text x="615" y="664" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2430">7</text>
<text x="430.0" y="663" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">git switch main + git pull</text>
<text x="430.0" y="698" text-anchor="middle" font-size="13" fill="#3b4150">récupère main à jour chez toi</text>
<rect x="40" y="715" width="350" height="62" rx="16" fill="#4a5ea6"/>
<circle cx="70" cy="746" r="15" fill="#ffffff"/>
<text x="70" y="752" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2430">8</text>
<text x="98" y="742" font-size="18" font-weight="700" fill="#ffffff">Ton main est à jour</text>
<text x="98" y="764" font-size="14" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">prêt pour la suite</text>
</svg>
