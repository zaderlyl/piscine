<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Test php-wasm</title>
</head>
<body>
  <h1>Test php-wasm</h1>
  <pre id="etat">Chargement de PHP...</pre>
  <pre id="sortie"></pre>
  <script type="module">
    import { PhpWeb } from "https://cdn.jsdelivr.net/npm/php-wasm@0.2.0/PhpWeb.mjs";

    const etat = document.getElementById("etat");
    const sortie = document.getElementById("sortie");
    const debut = performance.now();

    const php = new PhpWeb();
    php.addEventListener("output", (e) => { sortie.textContent += e.detail; });
    php.addEventListener("error", (e) => { sortie.textContent += e.detail; });

    await php.binary;
    etat.textContent = "PHP prêt en " + Math.round(performance.now() - debut) + " ms";

    await php.run('<?php echo "Bonjour depuis PHP " . PHP_VERSION . "\\n";');
  </script>
</body>
</html>
