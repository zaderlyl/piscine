<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Piscine</title>
</head>
<body>
  <div id="editeur">
    <nav id="navigation-exos"></nav>
    <nav id="doc-onglet"></nav>
    <div id="enonce"></div>
    <nav id="onglets"></nav>
    <div id="zones"></div>
    <footer id="barre-progression">
      <button id="btn-exporter" type="button" title="Télécharger ma progression locale">Exporter ma progression</button>
      <button id="btn-importer" type="button" title="Importer une progression existante">Importer</button>
      <input type="file" id="input-importer" accept=".json,application/json" class="cache">
      <span id="msg-progression" class="cache"></span>
    </footer>
  </div>
  <div id="separateur-v" class="barre barre-v" title="Glisser pour changer la largeur"></div>
  <div id="droite">
  <iframe id="apercu" sandbox="allow-scripts"></iframe>
  <div id="separateur-a" class="barre barre-h" title="Glisser pour changer la hauteur de l'aperçu"></div>
  <section id="variables"></section>
  <div id="separateur-b" class="barre barre-h" title="Glisser pour changer la hauteur des variables"></div>
  <pre id="resultat"></pre>
  </div>
  <script type="module" src="script.js?v=2"></script>
</body>
</html>
