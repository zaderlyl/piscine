<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Piscine : Git</title>
  <style>
    /* Couleurs du texte seulement : pas de style pour les boutons, champs ni étiquettes */
    body { font-family: sans-serif; color: #1f2328; }
    h1, h2 { color: #1f4e8c; }
    summary { color: #2b6cb0; }
    #statut { color: #5b6470; }
    #verdict { color: #2a7a2a; font-weight: bold; }
    #ecarts { color: #b35c00; }
  </style>
</head>
<body bgcolor="#ffffff" text="#000000">
  <h1 id="titre"></h1>

  <h2>Ta mission</h2>
  <div id="enonce"></div>
  <details>
    <summary>Le cours en bref</summary>
    <div id="cours"></div>
  </details>
  <details>
    <summary>Besoin d'un indice ?</summary>
    <div id="indice"></div>
  </details>

  <h2>Terminal</h2>
  <form id="formulaire">
    <input id="commande" placeholder="git status" autocomplete="off" aria-label="Commande git">
    <button>Lancer</button>
    <button type="button" id="recommencer">Recommencer</button>
    <button type="button" id="solution" hidden>Charger la solution</button>
  </form>
  <pre id="sortie"></pre>
  <p id="verdict"></p>
  <ul id="ecarts"></ul>

  <h2>Ton dépôt</h2>
  <div id="statut" aria-live="polite"></div>
  <div id="graphe"></div>
  <p>○ commit · <span style="color:#2a7a2a">● commit courant (HEAD, vert)</span> · étiquette encadrée en bleu : branche · <span style="color:#b35c00">cadre orange : vient de changer</span></p>

  <h2 id="titre-cible">Ce qu'on attend</h2>
  <div id="cible"></div>

  <script type="module" src="depot.js"></script>
</body>
</html>
