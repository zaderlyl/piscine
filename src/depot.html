<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Piscine : Git</title>
  <style>
    body { font-family: sans-serif; }
  </style>
</head>
<body bgcolor="#ffffff" text="#000000">
  <h1 id="titre"></h1>

  <h2>Ta mission</h2>
  <div id="enonce"></div>
  <details>
    <summary>Le cours en bref</summary>
    <div id="cours"></div>
  </details>
  <details>
    <summary>Besoin d'un indice ?</summary>
    <div id="indice"></div>
  </details>

  <h2>Terminal</h2>
  <form id="formulaire">
    <input id="commande" placeholder="git status" autocomplete="off" aria-label="Commande git">
    <button>Lancer</button>
    <button type="button" id="recommencer">Recommencer</button>
    <button type="button" id="solution" hidden>Charger la solution</button>
  </form>
  <pre id="sortie"></pre>
  <p id="verdict"></p>
  <ul id="ecarts"></ul>

  <h2>Ton dépôt</h2>
  <div id="statut" aria-live="polite"></div>
  <div id="graphe"></div>
  <p>○ commit · ● commit courant (HEAD) · étiquette encadrée : branche · trait épais : vient de changer</p>

  <h2 id="titre-cible">Ce qu'on attend</h2>
  <div id="cible"></div>

  <script type="module" src="depot.js"></script>
</body>
</html>
