<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piscine : Git</title>
  <style>
    body { font-family: sans-serif; margin: 16px; max-width: 1100px; }
    #page { display: flex; flex-wrap: wrap; gap: 24px; }
    #gauche { flex: 1 1 380px; }
    #droite { flex: 1 1 320px; }
    pre { background: #f4f4f4; padding: 8px; white-space: pre-wrap; }
    input { width: 70%; font-family: monospace; }
    .verdict { font-weight: bold; color: green; }
    .erreur { color: #b00; }
  </style>
</head>
<body>
  <h1 id="titre"></h1>
  <div id="page">
    <div id="gauche">
      <div id="cours"></div>
      <div id="enonce"></div>

      <form id="formulaire">
        <input id="commande" placeholder="git status" autocomplete="off">
        <button>Lancer</button>
        <button type="button" id="recommencer">Recommencer</button>
        <button type="button" id="solution" hidden>Charger la solution</button>
      </form>
      <pre id="sortie"></pre>
      <p id="verdict" class="verdict"></p>
    </div>

    <div id="droite">
      <h2>Ton dépôt</h2>
      <div id="graphe"></div>

      <h2 id="titre-cible">Cible</h2>
      <div id="cible"></div>
    </div>
  </div>

  <script type="module" src="depot.js"></script>
</body>
</html>
